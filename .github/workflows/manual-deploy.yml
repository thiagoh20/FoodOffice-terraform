      # - name: Limpiar ENIs de Lambda antes de destroy
      #   working-directory: ./
      #   run: |
      #     echo "🧹 Limpiando ENIs de Lambda antes de terraform destroy..."
      #     chmod +x scripts/cleanup-lambda-enis.sh
      #     ./scripts/cleanup-lambda-enis.sh
