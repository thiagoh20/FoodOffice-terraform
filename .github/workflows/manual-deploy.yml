name: Manual Deploy Infra

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

concurrency:
  group: terraform-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  development-manual:
    if: inputs.action == 'apply' && github.ref == 'refs/heads/develop'
    name: Deploy Manual a Desarrollo
    runs-on: ubuntu-latest
    environment: development
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4

      - name: Configure Git credentials for private modules
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=foodoffice-terraform-state" \
            -backend-config="key=environments/dev/terraform.tfstate" \
            -backend-config="region=us-east-2" \
            -backend-config="dynamodb_table=terraform-state-lock" \
            -backend-config="encrypt=true"

      - name: Importar OAC existente si es necesario
        working-directory: ./terraform
        run: |
          # Primero intentar obtener el bucket del estado
          BUCKET_NAME=$(terraform output -raw s3_bucket_name 2>/dev/null || echo "")
          
          # Si no está en el estado, buscar todos los OACs que coincidan con el patrón
          if [ -z "$BUCKET_NAME" ]; then
            echo "Bucket no encontrado en el estado, buscando OACs existentes..."
            # Buscar cualquier OAC que contenga foodoffice-frontend y dev-oac
            OAC_INFO=$(aws cloudfront list-origin-access-controls \
              --query "OriginAccessControlList.Items[?contains(Name, 'foodoffice-frontend') && contains(Name, 'dev-oac')].{Id:Id, Name:Name}" \
              --output json 2>/dev/null || echo '[]')
            
            # Obtener el primer OAC encontrado
            OAC_ID=$(echo "$OAC_INFO" | python3 -c "import json, sys; data=json.load(sys.stdin); print(data[0]['Id'] if data and len(data) > 0 else '')" 2>/dev/null || echo "")
            OAC_NAME=$(echo "$OAC_INFO" | python3 -c "import json, sys; data=json.load(sys.stdin); print(data[0]['Name'] if data and len(data) > 0 else '')" 2>/dev/null || echo "")
          else
            # Si tenemos el bucket, construir el nombre exacto del OAC
            OAC_NAME="${BUCKET_NAME}-dev-oac"
            echo "Buscando OAC con nombre exacto: $OAC_NAME"
            # Obtener solo el primer ID, limpiando tabs y espacios
            OAC_ID=$(aws cloudfront list-origin-access-controls \
              --query "OriginAccessControlList.Items[?Name=='$OAC_NAME'].Id" \
              --output text 2>/dev/null | head -1 | awk '{print $1}' | tr -d '\t' || echo "")
          fi
          
          # Limpiar el OAC_ID de cualquier carácter extraño y validar formato
          OAC_ID=$(echo "$OAC_ID" | awk '{print $1}' | grep -oP '^E[A-Z0-9]{12,13}$' | head -1 || echo "")
          
          if [ -n "$OAC_ID" ] && [ "$OAC_ID" != "None" ] && [ "$OAC_ID" != "" ]; then
            echo "OAC existente encontrado: $OAC_NAME (ID: $OAC_ID)"
            echo "Intentando importar al estado de Terraform..."
            
            # Intentar importar el OAC
            terraform import "module.foodoffice_frontend_cloudfront.aws_cloudfront_origin_access_control.s3_oac" "$OAC_ID" 2>&1 && {
              echo "✅ OAC importado exitosamente"
            } || {
              echo "⚠️ No se pudo importar (puede que ya esté en el estado)"
            }
          else
            echo "No se encontró OAC existente válido, se creará uno nuevo"
            echo "OAC_ID procesado fue: '$OAC_ID'"
          fi
        env:
          TF_VAR_environment: dev
          TF_VAR_bucket_name: ${{ secrets.TF_VAR_BUCKET_NAME }}
          TF_VAR_github_repository: ${{ secrets.TF_VAR_GITHUB_REPOSITORY }}
          TF_VAR_oidc_provider_arn: ${{ secrets.TF_VAR_OIDC_PROVIDER_ARN }}
        continue-on-error: true

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -out=tfplan
        env:
          TF_VAR_environment: dev
          TF_VAR_bucket_name: ${{ secrets.TF_VAR_BUCKET_NAME }}
          TF_VAR_github_repository: ${{ secrets.TF_VAR_GITHUB_REPOSITORY }}
          TF_VAR_oidc_provider_arn: ${{ secrets.TF_VAR_OIDC_PROVIDER_ARN }}

      - name: Verificar e importar OAC antes de apply
        working-directory: ./terraform
        run: |
          # Verificar si el OAC está en el estado
          if ! terraform state list 2>/dev/null | grep -q "module.foodoffice_frontend_cloudfront.aws_cloudfront_origin_access_control.s3_oac"; then
            echo "OAC no está en el estado, intentando importarlo..."
            
            # Obtener el bucket del estado (ahora debería existir después del plan)
            BUCKET_NAME=$(terraform output -raw s3_bucket_name 2>/dev/null || echo "")
            
            if [ -z "$BUCKET_NAME" ]; then
              echo "Bucket no encontrado en outputs, buscando en el estado..."
              # Intentar obtener del estado directamente
              BUCKET_NAME=$(terraform state show module.foodoffice_frontend_bucket_name.aws_s3_bucket.frontend 2>/dev/null | grep -oP 'id\s*=\s*"\K[^"]+' | head -1 || echo "")
            fi
            
            if [ -z "$BUCKET_NAME" ]; then
              # Último recurso: buscar cualquier OAC que coincida
              echo "Buscando OACs que coincidan con el patrón..."
              OAC_INFO=$(aws cloudfront list-origin-access-controls \
                --query "OriginAccessControlList.Items[?contains(Name, 'foodoffice-frontend') && contains(Name, 'dev-oac')].{Id:Id, Name:Name}" \
                --output json 2>/dev/null || echo '[]')
              
              OAC_ID=$(echo "$OAC_INFO" | python3 -c "import json, sys; data=json.load(sys.stdin); print(data[0]['Id'] if data and len(data) > 0 else '')" 2>/dev/null || echo "")
              if [ -n "$OAC_ID" ]; then
                OAC_NAME=$(echo "$OAC_INFO" | python3 -c "import json, sys; data=json.load(sys.stdin); print(data[0]['Name'] if data and len(data) > 0 else '')" 2>/dev/null || echo "")
                echo "OAC encontrado por patrón: $OAC_NAME (ID: $OAC_ID)"
              fi
            else
              OAC_NAME="${BUCKET_NAME}-dev-oac"
              echo "Buscando OAC con nombre exacto: $OAC_NAME"
              # Obtener solo el primer ID, limpiando tabs y espacios
              OAC_ID=$(aws cloudfront list-origin-access-controls \
                --query "OriginAccessControlList.Items[?Name=='$OAC_NAME'].Id" \
                --output text 2>/dev/null | head -1 | awk '{print $1}' | tr -d '\t' || echo "")
            fi
            
            # Limpiar y validar el OAC_ID
            OAC_ID=$(echo "$OAC_ID" | awk '{print $1}' | grep -oP '^E[A-Z0-9]{12,13}$' | head -1 || echo "")
            
            if [ -n "$OAC_ID" ] && [ "$OAC_ID" != "None" ] && [ "$OAC_ID" != "" ]; then
              echo "Importando OAC: $OAC_ID"
              terraform import "module.foodoffice_frontend_cloudfront.aws_cloudfront_origin_access_control.s3_oac" "$OAC_ID" && {
                echo "✅ OAC importado exitosamente, regenerando plan..."
                terraform plan -out=tfplan
              } || {
                echo "⚠️ No se pudo importar el OAC"
              }
            else
              echo "No se encontró OAC válido para importar"
            fi
          else
            echo "✅ OAC ya está en el estado"
          fi
        env:
          TF_VAR_environment: dev
          TF_VAR_bucket_name: ${{ secrets.TF_VAR_BUCKET_NAME }}
          TF_VAR_github_repository: ${{ secrets.TF_VAR_GITHUB_REPOSITORY }}
          TF_VAR_oidc_provider_arn: ${{ secrets.TF_VAR_OIDC_PROVIDER_ARN }}
        continue-on-error: true

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_environment: dev
          TF_VAR_bucket_name: ${{ secrets.TF_VAR_BUCKET_NAME }}
          TF_VAR_github_repository: ${{ secrets.TF_VAR_GITHUB_REPOSITORY }}
          TF_VAR_oidc_provider_arn: ${{ secrets.TF_VAR_OIDC_PROVIDER_ARN }}

  destroy-development:
    if: inputs.action == 'destroy' && github.ref == 'refs/heads/develop'
    name: Destroy Infraestructura de Desarrollo
    runs-on: ubuntu-latest
    environment: development
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4

      - name: Configure Git credentials for private modules
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=foodoffice-terraform-state" \
            -backend-config="key=environments/dev/terraform.tfstate" \
            -backend-config="region=us-east-2" \
            -backend-config="dynamodb_table=terraform-state-lock" \
            -backend-config="encrypt=true"

      - name: Terraform Destroy
        working-directory: ./terraform
        run: terraform destroy -auto-approve
        env:
          TF_VAR_environment: dev
          TF_VAR_bucket_name: ${{ secrets.TF_VAR_BUCKET_NAME }}
          TF_VAR_github_repository: ${{ secrets.TF_VAR_GITHUB_REPOSITORY }}
          TF_VAR_oidc_provider_arn: ${{ secrets.TF_VAR_OIDC_PROVIDER_ARN }}