name: Manual Deploy Infra

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

concurrency:
  group: terraform-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  development-manual:
    if: inputs.action == 'apply' && github.ref == 'refs/heads/develop'
    name: Deploy Manual a Desarrollo
    runs-on: ubuntu-latest
    environment: development
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4

      - name: Configure Git credentials for private modules
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=foodoffice-terraform-state" \
            -backend-config="key=environments/dev/terraform.tfstate" \
            -backend-config="region=us-east-2" \
            -backend-config="dynamodb_table=terraform-state-lock" \
            -backend-config="encrypt=true"


      - name: Terraform Apply
        id: terraform-apply
        working-directory: ./terraform
        continue-on-error: true
        run: terraform apply -auto-approve tfplan 2>&1 | tee /tmp/apply-output.txt
        env:
          TF_VAR_environment: dev
          TF_VAR_bucket_name: ${{ secrets.TF_VAR_BUCKET_NAME }}
          TF_VAR_github_repository: ${{ secrets.TF_VAR_GITHUB_REPOSITORY }}
          TF_VAR_oidc_provider_arn: ${{ secrets.TF_VAR_OIDC_PROVIDER_ARN }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}

  destroy-development:
    if: inputs.action == 'destroy' && github.ref == 'refs/heads/develop'
    name: Destroy Infraestructura de Desarrollo
    runs-on: ubuntu-latest
    environment: development
    
