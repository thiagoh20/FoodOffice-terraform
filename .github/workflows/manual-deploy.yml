name: Manual Deploy Infra

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

concurrency:
  group: terraform-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  development-manual:
    if: inputs.action == 'apply' && github.ref == 'refs/heads/develop'
    name: Deploy Manual a Desarrollo
    runs-on: ubuntu-latest
    environment: development
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4

      - name: Configure Git credentials for private modules
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Crear estado inicial y sincronizar checksum
        working-directory: ./
        run: |
          echo "🔍 Verificando y preparando estado de Terraform..."
          LOCK_ID="foodoffice-terraform-state/environments/dev/terraform.tfstate"
          STATE_KEY="environments/dev/terraform.tfstate"
          BUCKET_NAME="foodoffice-terraform-state"
          BACKEND_REGION="us-east-2"
          
          # Verificar si existe el archivo terraform.tfstate en S3
          if aws s3 ls "s3://${BUCKET_NAME}/${STATE_KEY}" --region "${BACKEND_REGION}" &> /dev/null; then
            echo "✅ Estado terraform.tfstate encontrado en S3"
            
            # Descargar el estado para calcular su checksum
            echo "📥 Descargando estado para calcular checksum..."
            TEMP_STATE="/tmp/terraform-state-check.tfstate"
            aws s3 cp "s3://${BUCKET_NAME}/${STATE_KEY}" "${TEMP_STATE}" --region "${BACKEND_REGION}" 2>/dev/null
            
            if [ -f "${TEMP_STATE}" ]; then
              # Calcular checksum MD5 del estado
              CALCULATED_CHECKSUM=$(md5sum "${TEMP_STATE}" | awk '{print $1}' || md5 -q "${TEMP_STATE}" || echo "")
              
              if [ -n "$CALCULATED_CHECKSUM" ]; then
                echo "📊 Checksum calculado del estado: ${CALCULATED_CHECKSUM}"
                
                # Verificar checksum actual en DynamoDB
                CURRENT_DIGEST=$(aws dynamodb get-item \
                  --table-name terraform-state-lock \
                  --key "{\"LockID\": {\"S\": \"${LOCK_ID}\"}}" \
                  --region "${BACKEND_REGION}" \
                  --query 'Item.Digest.S' \
                  --output text 2>/dev/null || echo "")
                
                if [ -n "$CURRENT_DIGEST" ] && [ "$CURRENT_DIGEST" != "None" ]; then
                  echo "📊 Checksum actual en DynamoDB: ${CURRENT_DIGEST}"
                  
                  if [ "$CURRENT_DIGEST" != "$CALCULATED_CHECKSUM" ]; then
                    echo "⚠️ Checksums no coinciden. Actualizando Digest en DynamoDB..."
                    aws dynamodb update-item \
                      --table-name terraform-state-lock \
                      --key "{\"LockID\": {\"S\": \"${LOCK_ID}\"}}" \
                      --update-expression "SET Digest = :digest" \
                      --expression-attribute-values "{\":digest\": {\"S\": \"${CALCULATED_CHECKSUM}\"}}" \
                      --region "${BACKEND_REGION}" 2>&1
                    
                    if [ $? -eq 0 ]; then
                      echo "✅ Digest actualizado con checksum correcto"
                    else
                      echo "⚠️ No se pudo actualizar Digest. Eliminándolo..."
                      aws dynamodb update-item \
                        --table-name terraform-state-lock \
                        --key "{\"LockID\": {\"S\": \"${LOCK_ID}\"}}" \
                        --update-expression "REMOVE Digest" \
                        --region "${BACKEND_REGION}" 2>&1 || echo "ℹ️ No se pudo eliminar Digest"
                    fi
                  else
                    echo "✅ Checksums coinciden. No se requiere actualización."
                  fi
                else
                  echo "ℹ️ No hay Digest en DynamoDB. Terraform lo creará automáticamente."
                fi
              else
                echo "⚠️ No se pudo calcular checksum. Eliminando Digest para que Terraform lo recalcule..."
                aws dynamodb update-item \
                  --table-name terraform-state-lock \
                  --key "{\"LockID\": {\"S\": \"${LOCK_ID}\"}}" \
                  --update-expression "REMOVE Digest" \
                  --region "${BACKEND_REGION}" 2>&1 || echo "ℹ️ No se pudo eliminar Digest"
              fi
              
              # Limpiar archivo temporal
              rm -f "${TEMP_STATE}"
            else
              echo "⚠️ No se pudo descargar el estado. Eliminando Digest..."
              aws dynamodb update-item \
                --table-name terraform-state-lock \
                --key "{\"LockID\": {\"S\": \"${LOCK_ID}\"}}" \
                --update-expression "REMOVE Digest" \
                --region "${BACKEND_REGION}" 2>&1 || echo "ℹ️ No se pudo eliminar Digest"
            fi
          else
            echo "⚠️ Estado terraform.tfstate NO encontrado en S3"
            echo "   El bucket está vacío. Creando estado inicial..."
            echo ""
            
            # Eliminar lock si existe
            echo "🗑️ Eliminando lock de DynamoDB si existe..."
            aws dynamodb delete-item \
              --table-name terraform-state-lock \
              --key "{\"LockID\": {\"S\": \"${LOCK_ID}\"}}" \
              --region "${BACKEND_REGION}" 2>&1 || echo "ℹ️ No hay lock para eliminar"
            
            # Crear estado inicial vacío
            echo "📝 Creando estado inicial vacío en S3..."
            INITIAL_STATE='{"version":4,"terraform_version":"1.13.4","serial":1,"lineage":"'$(openssl rand -hex 16)'","outputs":{},"resources":[]}'
            
            echo "$INITIAL_STATE" | aws s3 cp - \
              "s3://${BUCKET_NAME}/${STATE_KEY}" \
              --region "${BACKEND_REGION}" \
              --content-type "application/json" \
              --metadata "terraform-state=initial"
            
            if [ $? -eq 0 ]; then
              echo "✅ Estado inicial creado exitosamente en S3"
            else
              echo "⚠️ Error al crear estado inicial. Terraform lo creará automáticamente."
            fi
          fi
        continue-on-error: true

      - name: Terraform Init
        id: terraform-init
        working-directory: ./terraform
        continue-on-error: true
        run: |
          terraform init \
            -backend-config="bucket=foodoffice-terraform-state" \
            -backend-config="key=environments/dev/terraform.tfstate" \
            -backend-config="region=us-east-2" \
            -backend-config="dynamodb_table=terraform-state-lock" \
            -backend-config="encrypt=true" 2>&1 | tee /tmp/init-output.txt
        env:
          TF_VAR_environment: dev
          TF_VAR_bucket_name: ${{ secrets.TF_VAR_BUCKET_NAME }}
          TF_VAR_github_repository: ${{ secrets.TF_VAR_GITHUB_REPOSITORY }}
          TF_VAR_oidc_provider_arn: ${{ secrets.TF_VAR_OIDC_PROVIDER_ARN }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}

      - name: Reparar checksum del estado si es necesario
        if: steps.terraform-init.outcome == 'failure'
        working-directory: ./
        run: |
          INIT_OUTPUT=$(cat /tmp/init-output.txt 2>/dev/null || echo "")
          
          echo "📋 Output del terraform init:"
          echo "$INIT_OUTPUT"
          echo ""
          
          # Verificar si el error es de checksum (múltiples patrones)
          if echo "$INIT_OUTPUT" | grep -qiE "checksum|state data in S3 does not have the expected content|Calculated checksum|Stored checksum"; then
            echo "🔧 Error de checksum detectado. Reparando automáticamente..."
            
            LOCK_ID="foodoffice-terraform-state/environments/dev/terraform.tfstate"
            
            # Intentar extraer el checksum calculado del mensaje de error
            CALCULATED_CHECKSUM=$(echo "$INIT_OUTPUT" | grep -oE "Calculated checksum:\s*([a-f0-9]+)" | awk '{print $3}' | head -1)
            
            if [ -n "$CALCULATED_CHECKSUM" ]; then
              echo "📝 Checksum calculado encontrado: ${CALCULATED_CHECKSUM}"
              echo "🔄 Actualizando Digest en DynamoDB con el checksum correcto..."
              
              # Actualizar el Digest con el checksum correcto
              aws dynamodb update-item \
                --table-name terraform-state-lock \
                --key "{\"LockID\": {\"S\": \"${LOCK_ID}\"}}" \
                --update-expression "SET Digest = :digest" \
                --expression-attribute-values "{\":digest\": {\"S\": \"${CALCULATED_CHECKSUM}\"}}" \
                --region us-east-2 2>&1
              
              if [ $? -eq 0 ]; then
                echo "✅ Digest actualizado con el checksum correcto"
              else
                echo "⚠️ No se pudo actualizar el Digest. Intentando eliminar..."
                aws dynamodb update-item \
                  --table-name terraform-state-lock \
                  --key "{\"LockID\": {\"S\": \"${LOCK_ID}\"}}" \
                  --update-expression "REMOVE Digest" \
                  --region us-east-2 2>&1 || {
                  echo "⚠️ No se pudo eliminar el Digest. Eliminando lock completo..."
                  aws dynamodb delete-item \
                    --table-name terraform-state-lock \
                    --key "{\"LockID\": {\"S\": \"${LOCK_ID}\"}}" \
                    --region us-east-2 2>&1 || echo "⚠️ No se pudo eliminar el lock"
                }
              fi
            else
              echo "⚠️ No se pudo extraer el checksum calculado. Eliminando Digest..."
              # Si no podemos extraer el checksum, eliminar el Digest para que Terraform lo recalcule
              aws dynamodb update-item \
                --table-name terraform-state-lock \
                --key "{\"LockID\": {\"S\": \"${LOCK_ID}\"}}" \
                --update-expression "REMOVE Digest" \
                --region us-east-2 2>&1 || {
                echo "⚠️ No se pudo eliminar el Digest. Eliminando lock completo..."
                aws dynamodb delete-item \
                  --table-name terraform-state-lock \
                  --key "{\"LockID\": {\"S\": \"${LOCK_ID}\"}}" \
                  --region us-east-2 2>&1 || echo "⚠️ No se pudo eliminar el lock"
              }
            fi
            
            echo "✅ Checksum reparado. Reintentando terraform init..."
            cd terraform
            terraform init \
              -backend-config="bucket=foodoffice-terraform-state" \
              -backend-config="key=environments/dev/terraform.tfstate" \
              -backend-config="region=us-east-2" \
              -backend-config="dynamodb_table=terraform-state-lock" \
              -backend-config="encrypt=true" \
              -reconfigure
            
            if [ $? -eq 0 ]; then
              echo "✅ Terraform init exitoso después de reparar checksum"
            else
              echo "❌ Terraform init aún falla después de reparar. Verifica el estado manualmente."
              exit 1
            fi
          else
            echo "❌ Error diferente al de checksum. Mostrando output completo:"
            echo "$INIT_OUTPUT"
            exit 1
          fi
        continue-on-error: false
        env:
          TF_VAR_environment: dev
          TF_VAR_bucket_name: ${{ secrets.TF_VAR_BUCKET_NAME }}
          TF_VAR_github_repository: ${{ secrets.TF_VAR_GITHUB_REPOSITORY }}
          TF_VAR_oidc_provider_arn: ${{ secrets.TF_VAR_OIDC_PROVIDER_ARN }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}

      - name: Importar recursos existentes al estado de Terraform
        working-directory: ./
        run: |
          echo "🔄 Importando recursos existentes que pueden causar conflictos..."
          chmod +x scripts/import-existing-resources.sh
          ./scripts/import-existing-resources.sh || echo "⚠️ Algunos recursos no se pudieron importar, continuando..."
        continue-on-error: true
        env:
          AWS_REGION: us-east-1
          ENVIRONMENT: dev
          PROJECT_NAME: foodoffice
          TERRAFORM_DIR: terraform
          TF_VAR_environment: dev
          TF_VAR_bucket_name: ${{ secrets.TF_VAR_BUCKET_NAME }}
          TF_VAR_github_repository: ${{ secrets.TF_VAR_GITHUB_REPOSITORY }}
          TF_VAR_oidc_provider_arn: ${{ secrets.TF_VAR_OIDC_PROVIDER_ARN }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -out=tfplan
        env:
          TF_VAR_environment: dev
          TF_VAR_bucket_name: ${{ secrets.TF_VAR_BUCKET_NAME }}
          TF_VAR_github_repository: ${{ secrets.TF_VAR_GITHUB_REPOSITORY }}
          TF_VAR_oidc_provider_arn: ${{ secrets.TF_VAR_OIDC_PROVIDER_ARN }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}

      - name: Terraform Apply
        id: terraform-apply
        working-directory: ./terraform
        continue-on-error: true
        run: terraform apply -auto-approve tfplan 2>&1 | tee /tmp/apply-output.txt
        env:
          TF_VAR_environment: dev
          TF_VAR_bucket_name: ${{ secrets.TF_VAR_BUCKET_NAME }}
          TF_VAR_github_repository: ${{ secrets.TF_VAR_GITHUB_REPOSITORY }}
          TF_VAR_oidc_provider_arn: ${{ secrets.TF_VAR_OIDC_PROVIDER_ARN }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}

  destroy-development:
    if: inputs.action == 'destroy' && github.ref == 'refs/heads/develop'
    name: Destroy Infraestructura de Desarrollo
    runs-on: ubuntu-latest
    environment: development
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # - name: Setup Terraform
      #   uses: hashicorp/setup-terraform@v3
      #   with:
      #     terraform_version: 1.13.4

      # - name: Configure Git credentials for private modules
      #   run: |
      #     git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

