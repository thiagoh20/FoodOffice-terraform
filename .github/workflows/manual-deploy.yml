name: Manual Deploy Infra

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

concurrency:
  group: terraform-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  development-manual:
    if: inputs.action == 'apply' && github.ref == 'refs/heads/develop'
    name: Deploy Manual a Desarrollo
    runs-on: ubuntu-latest
    environment: development
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4

      - name: Configure Git credentials for private modules
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=foodoffice-terraform-state" \
            -backend-config="key=environments/dev/terraform.tfstate" \
            -backend-config="region=us-east-2" \
            -backend-config="dynamodb_table=terraform-state-lock" \
            -backend-config="encrypt=true"

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -out=tfplan
        env:
          TF_VAR_environment: dev
          TF_VAR_bucket_name: ${{ secrets.TF_VAR_BUCKET_NAME }}
          TF_VAR_github_repository: ${{ secrets.TF_VAR_GITHUB_REPOSITORY }}
          TF_VAR_oidc_provider_arn: ${{ secrets.TF_VAR_OIDC_PROVIDER_ARN }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}

      - name: Importar regla de seguridad existente (si existe)
        working-directory: ./terraform
        continue-on-error: true
        run: |
          # Obtener IDs de Security Groups desde outputs de Terraform
          LAMBDA_SG=$(terraform output -raw lambda_security_group_id 2>/dev/null || echo "")
          RDS_SG=$(terraform output -raw rds_security_group_id 2>/dev/null || echo "")
          
          if [ -z "$LAMBDA_SG" ] || [ -z "$RDS_SG" ]; then
            echo "⚠️  No se pudieron obtener los Security Group IDs. Saltando importación."
            exit 0
          fi
          
          echo "🔍 Buscando regla existente..."
          echo "Lambda SG: $LAMBDA_SG"
          echo "RDS SG: $RDS_SG"
          
          # Buscar la regla existente usando describe-security-groups (más confiable)
          echo "🔍 Buscando regla en Security Group de RDS..."
          
          # Obtener todas las reglas de ingress del Security Group de RDS
          RULES_JSON=$(aws ec2 describe-security-groups \
            --group-ids "${RDS_SG}" \
            --query "SecurityGroups[0].IpPermissions[?FromPort==\`5432\` && ToPort==\`5432\` && IpProtocol==\`tcp\`]" \
            --output json 2>/dev/null || echo "[]")
          
          # Buscar si hay una regla que permita desde el Security Group de Lambda
          RULE_ID=$(echo "$RULES_JSON" | \
            jq -r --arg LAMBDA_SG "$LAMBDA_SG" \
            '.[] | select(.UserIdGroupPairs[]?.GroupId == $LAMBDA_SG) | .UserIdGroupPairs[0].GroupId' 2>/dev/null || echo "")
          
          # Si encontramos la regla, necesitamos obtener su ID usando describe-security-group-rules
          if [ -n "$RULE_ID" ] && [ "$RULE_ID" == "$LAMBDA_SG" ]; then
            echo "✅ Regla encontrada en configuración. Obteniendo ID de la regla..."
            
            # Obtener el ID de la regla usando describe-security-group-rules
            RULE_ID=$(aws ec2 describe-security-group-rules \
              --filters "Name=group-id,Values=${RDS_SG}" \
                        "Name=is-egress,Values=false" \
                        "Name=ip-protocol,Values=tcp" \
                        "Name=from-port,Values=5432" \
                        "Name=to-port,Values=5432" \
              --query "SecurityGroupRules[?ReferencedGroupInfo.GroupId==\`${LAMBDA_SG}\`].SecurityGroupRuleId" \
              --output text 2>/dev/null | head -1 || echo "")
          fi
          
          if [ -z "$RULE_ID" ] || [ "$RULE_ID" == "None" ] || [ "$RULE_ID" == "null" ]; then
            echo "⚠️  No se encontró regla por ID. Intentando método alternativo..."
            
            # Método alternativo: buscar todas las reglas y filtrar manualmente
            ALL_RULES=$(aws ec2 describe-security-group-rules \
              --filters "Name=group-id,Values=${RDS_SG}" \
                        "Name=is-egress,Values=false" \
                        "Name=ip-protocol,Values=tcp" \
                        "Name=from-port,Values=5432" \
                        "Name=to-port,Values=5432" \
              --output json 2>/dev/null || echo "[]")
            
            RULE_ID=$(echo "$ALL_RULES" | \
              jq -r --arg LAMBDA_SG "$LAMBDA_SG" \
              '.SecurityGroupRules[] | select(.ReferencedGroupInfo.GroupId == $LAMBDA_SG) | .SecurityGroupRuleId' 2>/dev/null | head -1 || echo "")
            
            if [ -z "$RULE_ID" ] || [ "$RULE_ID" == "None" ] || [ "$RULE_ID" == "null" ]; then
              echo "✅ No se encontró regla existente. Terraform la creará."
              echo "ℹ️  Si terraform apply falla con error de duplicado, la regla existe pero no se pudo detectar."
              exit 0
            fi
          fi
          
          echo "✅ Regla encontrada: $RULE_ID"
          echo "📥 Importando regla a Terraform..."
          
          # Intentar importar la regla
          terraform import \
            module.rds_security_groups.aws_security_group_rule.rds_ingress_from_lambda \
            "$RULE_ID" 2>&1 | tee /tmp/import-output.txt || {
            IMPORT_ERROR=$(cat /tmp/import-output.txt)
            if echo "$IMPORT_ERROR" | grep -q "already managed"; then
              echo "✅ Regla ya está en el estado de Terraform."
            elif echo "$IMPORT_ERROR" | grep -q "Cannot import"; then
              echo "⚠️  No se pudo importar la regla. Puede que el recurso no exista en el código o haya un problema de configuración."
            else
              echo "⚠️  Error al importar: $IMPORT_ERROR"
            fi
            exit 0
          }
          
          echo "✅ Regla importada exitosamente"
        env:
          TF_VAR_environment: dev
          TF_VAR_bucket_name: ${{ secrets.TF_VAR_BUCKET_NAME }}
          TF_VAR_github_repository: ${{ secrets.TF_VAR_GITHUB_REPOSITORY }}
          TF_VAR_oidc_provider_arn: ${{ secrets.TF_VAR_OIDC_PROVIDER_ARN }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}

      - name: Terraform Apply
        id: terraform-apply
        working-directory: ./terraform
        continue-on-error: true
        run: terraform apply -auto-approve tfplan 2>&1 | tee /tmp/apply-output.txt
        env:
          TF_VAR_environment: dev
          TF_VAR_bucket_name: ${{ secrets.TF_VAR_BUCKET_NAME }}
          TF_VAR_github_repository: ${{ secrets.TF_VAR_GITHUB_REPOSITORY }}
          TF_VAR_oidc_provider_arn: ${{ secrets.TF_VAR_OIDC_PROVIDER_ARN }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}

      - name: Manejar error de regla duplicada
        if: steps.terraform-apply.outcome == 'failure'
        working-directory: ./terraform
        run: |
          APPLY_OUTPUT=$(cat /tmp/apply-output.txt)
          
          if echo "$APPLY_OUTPUT" | grep -q "InvalidPermission.Duplicate"; then
            echo "⚠️  Error de regla duplicada detectado. Intentando importar la regla..."
            
            # Obtener IDs de Security Groups
            LAMBDA_SG=$(terraform output -raw lambda_security_group_id 2>/dev/null || echo "sg-07387339b35fe5c83")
            RDS_SG=$(terraform output -raw rds_security_group_id 2>/dev/null || echo "sg-05ab21fca371a7df5")
            
            echo "Lambda SG: $LAMBDA_SG"
            echo "RDS SG: $RDS_SG"
            
            # Buscar la regla usando múltiples métodos
            RULE_ID=$(aws ec2 describe-security-group-rules \
              --filters "Name=group-id,Values=${RDS_SG}" \
                        "Name=is-egress,Values=false" \
                        "Name=ip-protocol,Values=tcp" \
                        "Name=from-port,Values=5432" \
                        "Name=to-port,Values=5432" \
              --query "SecurityGroupRules[?ReferencedGroupInfo.GroupId==\`${LAMBDA_SG}\`].SecurityGroupRuleId" \
              --output text 2>/dev/null | head -1 || echo "")
            
            if [ -z "$RULE_ID" ] || [ "$RULE_ID" == "None" ]; then
              # Método alternativo: obtener todas las reglas y filtrar
              ALL_RULES=$(aws ec2 describe-security-groups \
                --group-ids "${RDS_SG}" \
                --query "SecurityGroups[0].IpPermissions[?FromPort==\`5432\` && ToPort==\`5432\` && IpProtocol==\`tcp\`]" \
                --output json 2>/dev/null || echo "[]")
              
              HAS_LAMBDA_RULE=$(echo "$ALL_RULES" | \
                jq -r --arg LAMBDA_SG "$LAMBDA_SG" \
                '.[] | select(.UserIdGroupPairs[]?.GroupId == $LAMBDA_SG) | "found"' 2>/dev/null | head -1 || echo "")
              
              if [ "$HAS_LAMBDA_RULE" == "found" ]; then
                # Si la regla existe pero no podemos obtener su ID, intentar eliminarla y recrearla
                echo "⚠️  Regla existe pero no se puede obtener ID. Eliminando regla manualmente..."
                aws ec2 revoke-security-group-ingress \
                  --group-id "${RDS_SG}" \
                  --protocol tcp \
                  --port 5432 \
                  --source-group "${LAMBDA_SG}" 2>/dev/null || echo "No se pudo eliminar la regla"
                
                echo "🔄 Re-ejecutando terraform apply..."
                terraform apply -auto-approve tfplan
                exit 0
              fi
            fi
            
            if [ -n "$RULE_ID" ] && [ "$RULE_ID" != "None" ]; then
              echo "✅ Regla encontrada: $RULE_ID"
              echo "📥 Importando regla..."
              
              terraform import \
                module.rds_security_groups.aws_security_group_rule.rds_ingress_from_lambda \
                "$RULE_ID" || echo "⚠️  No se pudo importar"
              
              echo "🔄 Re-ejecutando terraform apply..."
              terraform apply -auto-approve tfplan
            else
              echo "❌ No se pudo resolver el error de regla duplicada"
              exit 1
            fi
          else
            echo "❌ Error diferente al de regla duplicada:"
            echo "$APPLY_OUTPUT"
            exit 1
          fi
        env:
          TF_VAR_environment: dev
          TF_VAR_bucket_name: ${{ secrets.TF_VAR_BUCKET_NAME }}
          TF_VAR_github_repository: ${{ secrets.TF_VAR_GITHUB_REPOSITORY }}
          TF_VAR_oidc_provider_arn: ${{ secrets.TF_VAR_OIDC_PROVIDER_ARN }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}

  destroy-development:
    if: inputs.action == 'destroy' && github.ref == 'refs/heads/develop'
    name: Destroy Infraestructura de Desarrollo
    runs-on: ubuntu-latest
    environment: development
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4

      - name: Configure Git credentials for private modules
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=foodoffice-terraform-state" \
            -backend-config="key=environments/dev/terraform.tfstate" \
            -backend-config="region=us-east-2" \
            -backend-config="dynamodb_table=terraform-state-lock" \
            -backend-config="encrypt=true"

      - name: Terraform Destroy
        working-directory: ./terraform
        run: terraform destroy -auto-approve
        env:
          TF_VAR_environment: dev
          TF_VAR_bucket_name: ${{ secrets.TF_VAR_BUCKET_NAME }}
          TF_VAR_github_repository: ${{ secrets.TF_VAR_GITHUB_REPOSITORY }}
          TF_VAR_oidc_provider_arn: ${{ secrets.TF_VAR_OIDC_PROVIDER_ARN }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}