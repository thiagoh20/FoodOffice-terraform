name: Manual Deploy Infra

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

concurrency:
  group: terraform-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  development-manual:
    if: inputs.action == 'apply' && github.ref == 'refs/heads/develop'
    name: Deploy Manual a Desarrollo
    runs-on: ubuntu-latest
    environment: development
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4

      - name: Configure Git credentials for private modules
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=foodoffice-terraform-state" \
            -backend-config="key=environments/dev/terraform.tfstate" \
            -backend-config="region=us-east-2" \
            -backend-config="dynamodb_table=terraform-state-lock" \
            -backend-config="encrypt=true"

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -out=tfplan
        env:
          TF_VAR_environment: dev
          TF_VAR_bucket_name: ${{ secrets.TF_VAR_BUCKET_NAME }}
          TF_VAR_github_repository: ${{ secrets.TF_VAR_GITHUB_REPOSITORY }}
          TF_VAR_oidc_provider_arn: ${{ secrets.TF_VAR_OIDC_PROVIDER_ARN }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}

      - name: Eliminar regla de seguridad duplicada (si existe)
        working-directory: ./terraform
        continue-on-error: true
        run: |
          # Obtener IDs de Security Groups desde outputs de Terraform
          LAMBDA_SG=$(terraform output -raw lambda_security_group_id 2>/dev/null || echo "sg-07387339b35fe5c83")
          RDS_SG=$(terraform output -raw rds_security_group_id 2>/dev/null || echo "sg-05ab21fca371a7df5")
          
          echo "🔍 Verificando si existe regla duplicada..."
          echo "Lambda SG: $LAMBDA_SG"
          echo "RDS SG: $RDS_SG"
          
          # Verificar si la regla existe usando describe-security-groups
          HAS_RULE=$(aws ec2 describe-security-groups \
            --group-ids "${RDS_SG}" \
            --query "SecurityGroups[0].IpPermissions[?FromPort==\`5432\` && ToPort==\`5432\` && IpProtocol==\`tcp\` && length(UserIdGroupPairs[?GroupId==\`${LAMBDA_SG}\`]) > \`0\`]" \
            --output text 2>/dev/null || echo "")
          
          if [ -n "$HAS_RULE" ] && [ "$HAS_RULE" != "None" ]; then
            echo "⚠️  Regla duplicada encontrada. Eliminándola para que Terraform la cree..."
            
            # Eliminar la regla usando revoke-security-group-ingress
            aws ec2 revoke-security-group-ingress \
              --group-id "${RDS_SG}" \
              --protocol tcp \
              --port 5432 \
              --source-group "${LAMBDA_SG}" 2>&1 || {
              echo "⚠️  No se pudo eliminar la regla. Puede que ya no exista o haya un problema de permisos."
              exit 0
            }
            
            echo "✅ Regla eliminada exitosamente. Terraform la creará de nuevo."
          else
            echo "✅ No se encontró regla duplicada. Terraform la creará normalmente."
          fi
        env:
          TF_VAR_environment: dev
          TF_VAR_bucket_name: ${{ secrets.TF_VAR_BUCKET_NAME }}
          TF_VAR_github_repository: ${{ secrets.TF_VAR_GITHUB_REPOSITORY }}
          TF_VAR_oidc_provider_arn: ${{ secrets.TF_VAR_OIDC_PROVIDER_ARN }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}

      - name: Terraform Apply
        id: terraform-apply
        working-directory: ./terraform
        continue-on-error: true
        run: terraform apply -auto-approve tfplan 2>&1 | tee /tmp/apply-output.txt
        env:
          TF_VAR_environment: dev
          TF_VAR_bucket_name: ${{ secrets.TF_VAR_BUCKET_NAME }}
          TF_VAR_github_repository: ${{ secrets.TF_VAR_GITHUB_REPOSITORY }}
          TF_VAR_oidc_provider_arn: ${{ secrets.TF_VAR_OIDC_PROVIDER_ARN }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}

      - name: Manejar error de regla duplicada (respaldo)
        if: steps.terraform-apply.outcome == 'failure'
        working-directory: ./terraform
        continue-on-error: true
        run: |
          APPLY_OUTPUT=$(cat /tmp/apply-output.txt 2>/dev/null || echo "")
          
          if echo "$APPLY_OUTPUT" | grep -q "InvalidPermission.Duplicate"; then
            echo "⚠️  Error de regla duplicada detectado. Eliminando regla existente..."
            
            # Obtener IDs de Security Groups
            LAMBDA_SG=$(terraform output -raw lambda_security_group_id 2>/dev/null || echo "sg-07387339b35fe5c83")
            RDS_SG=$(terraform output -raw rds_security_group_id 2>/dev/null || echo "sg-05ab21fca371a7df5")
            
            echo "Eliminando regla: Lambda SG $LAMBDA_SG -> RDS SG $RDS_SG (puerto 5432)"
            
            # Eliminar la regla
            aws ec2 revoke-security-group-ingress \
              --group-id "${RDS_SG}" \
              --protocol tcp \
              --port 5432 \
              --source-group "${LAMBDA_SG}" 2>&1 || {
              echo "⚠️  No se pudo eliminar la regla. Puede que ya no exista."
            }
            
            echo "🔄 Re-ejecutando terraform apply..."
            terraform apply -auto-approve tfplan || {
              echo "❌ Error al re-ejecutar terraform apply"
              exit 1
            }
            
            echo "✅ Terraform apply completado exitosamente después de eliminar la regla duplicada"
          else
            echo "❌ Error diferente al de regla duplicada. Mostrando output:"
            echo "$APPLY_OUTPUT"
            exit 1
          fi
        env:
          TF_VAR_environment: dev
          TF_VAR_bucket_name: ${{ secrets.TF_VAR_BUCKET_NAME }}
          TF_VAR_github_repository: ${{ secrets.TF_VAR_GITHUB_REPOSITORY }}
          TF_VAR_oidc_provider_arn: ${{ secrets.TF_VAR_OIDC_PROVIDER_ARN }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}

  destroy-development:
    if: inputs.action == 'destroy' && github.ref == 'refs/heads/develop'
    name: Destroy Infraestructura de Desarrollo
    runs-on: ubuntu-latest
    environment: development
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4

      - name: Configure Git credentials for private modules
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=foodoffice-terraform-state" \
            -backend-config="key=environments/dev/terraform.tfstate" \
            -backend-config="region=us-east-2" \
            -backend-config="dynamodb_table=terraform-state-lock" \
            -backend-config="encrypt=true"

      - name: Limpiar ENIs de Lambda antes de destroy
        working-directory: ./
        run: |
          echo "🧹 Limpiando ENIs de Lambda antes de terraform destroy..."
          chmod +x scripts/cleanup-lambda-enis.sh
          ./scripts/cleanup-lambda-enis.sh
        continue-on-error: true
        env:
          AWS_REGION: us-east-1

      - name: Terraform Destroy
        working-directory: ./terraform
        run: terraform destroy -auto-approve
        env:
          TF_VAR_environment: dev
          TF_VAR_bucket_name: ${{ secrets.TF_VAR_BUCKET_NAME }}
          TF_VAR_github_repository: ${{ secrets.TF_VAR_GITHUB_REPOSITORY }}
          TF_VAR_oidc_provider_arn: ${{ secrets.TF_VAR_OIDC_PROVIDER_ARN }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}