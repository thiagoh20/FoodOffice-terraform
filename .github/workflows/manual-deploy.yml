name: Manual Deploy Infra

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

concurrency:
  group: terraform-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  development-manual:
    if: inputs.action == 'apply' && github.ref == 'refs/heads/develop'
    name: Deploy Manual a Desarrollo
    runs-on: ubuntu-latest
    environment: development
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4

      - name: Configure Git credentials for private modules
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Limpiar lock en DynamoDB si el estado no existe en S3
        working-directory: ./
        run: |
          echo "🔍 Verificando si el estado existe en S3..."
          LOCK_ID="foodoffice-terraform-state/environments/dev/terraform.tfstate"
          STATE_KEY="environments/dev/terraform.tfstate"
          
          # Verificar si existe el estado en S3
          if aws s3 ls "s3://foodoffice-terraform-state/${STATE_KEY}" --region us-east-2 &> /dev/null; then
            echo "✅ Estado encontrado en S3"
            
            # Si existe el estado, solo limpiar el Digest del lock
            LOCK_EXISTS=$(aws dynamodb get-item \
              --table-name terraform-state-lock \
              --key "{\"LockID\": {\"S\": \"${LOCK_ID}\"}}" \
              --region us-east-2 \
              --query 'Item' \
              --output text 2>/dev/null || echo "None")
            
            if [ "$LOCK_EXISTS" != "None" ] && [ -n "$LOCK_EXISTS" ]; then
              echo "🗑️ Eliminando Digest del lock existente..."
              aws dynamodb update-item \
                --table-name terraform-state-lock \
                --key "{\"LockID\": {\"S\": \"${LOCK_ID}\"}}" \
                --update-expression "REMOVE Digest" \
                --region us-east-2 2>&1 || echo "⚠️ No se pudo eliminar el Digest"
              echo "✅ Digest limpiado"
            fi
          else
            echo "⚠️ Estado NO encontrado en S3 (bucket vacío o estado borrado)"
            echo "🗑️ Eliminando lock completo de DynamoDB ya que no hay estado en S3..."
            
            # Eliminar el lock completo si no hay estado
            aws dynamodb delete-item \
              --table-name terraform-state-lock \
              --key "{\"LockID\": {\"S\": \"${LOCK_ID}\"}}" \
              --region us-east-2 2>&1 || echo "⚠️ No se pudo eliminar el lock (puede que no exista)"
            
            echo "✅ Lock eliminado. Terraform creará un estado nuevo."
          fi
        continue-on-error: true

      - name: Terraform Init
        id: terraform-init
        working-directory: ./terraform
        continue-on-error: true
        run: |
          terraform init \
            -backend-config="bucket=foodoffice-terraform-state" \
            -backend-config="key=environments/dev/terraform.tfstate" \
            -backend-config="region=us-east-2" \
            -backend-config="dynamodb_table=terraform-state-lock" \
            -backend-config="encrypt=true" 2>&1 | tee /tmp/init-output.txt
        env:
          TF_VAR_environment: dev
          TF_VAR_bucket_name: ${{ secrets.TF_VAR_BUCKET_NAME }}
          TF_VAR_github_repository: ${{ secrets.TF_VAR_GITHUB_REPOSITORY }}
          TF_VAR_oidc_provider_arn: ${{ secrets.TF_VAR_OIDC_PROVIDER_ARN }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}

      - name: Reparar checksum del estado si es necesario
        if: steps.terraform-init.outcome == 'failure'
        working-directory: ./
        run: |
          INIT_OUTPUT=$(cat /tmp/init-output.txt 2>/dev/null || echo "")
          
          echo "📋 Output del terraform init:"
          echo "$INIT_OUTPUT"
          echo ""
          
          # Verificar si el error es de checksum (múltiples patrones)
          if echo "$INIT_OUTPUT" | grep -qiE "checksum|state data in S3 does not have the expected content|Calculated checksum|Stored checksum"; then
            echo "🔧 Error de checksum detectado. Reparando automáticamente..."
            
            # Eliminar el Digest del lock en DynamoDB (solución automática)
            LOCK_ID="foodoffice-terraform-state/environments/dev/terraform.tfstate"
            echo "🗑️ Eliminando Digest del lock en DynamoDB..."
            
            # Intentar eliminar el Digest
            aws dynamodb update-item \
              --table-name terraform-state-lock \
              --key "{\"LockID\": {\"S\": \"${LOCK_ID}\"}}" \
              --update-expression "REMOVE Digest" \
              --region us-east-2 2>&1 || {
              echo "⚠️ No se pudo eliminar el Digest. Intentando eliminar el lock completo..."
              aws dynamodb delete-item \
                --table-name terraform-state-lock \
                --key "{\"LockID\": {\"S\": \"${LOCK_ID}\"}}" \
                --region us-east-2 2>&1 || echo "⚠️ No se pudo eliminar el lock"
            }
            
            echo "✅ Checksum reparado. Reintentando terraform init..."
            cd terraform
            terraform init \
              -backend-config="bucket=foodoffice-terraform-state" \
              -backend-config="key=environments/dev/terraform.tfstate" \
              -backend-config="region=us-east-2" \
              -backend-config="dynamodb_table=terraform-state-lock" \
              -backend-config="encrypt=true" \
              -reconfigure
            
            if [ $? -eq 0 ]; then
              echo "✅ Terraform init exitoso después de reparar checksum"
            else
              echo "❌ Terraform init aún falla después de reparar. Verifica el estado manualmente."
              exit 1
            fi
          else
            echo "❌ Error diferente al de checksum. Mostrando output completo:"
            echo "$INIT_OUTPUT"
            exit 1
          fi
        continue-on-error: false
        env:
          TF_VAR_environment: dev
          TF_VAR_bucket_name: ${{ secrets.TF_VAR_BUCKET_NAME }}
          TF_VAR_github_repository: ${{ secrets.TF_VAR_GITHUB_REPOSITORY }}
          TF_VAR_oidc_provider_arn: ${{ secrets.TF_VAR_OIDC_PROVIDER_ARN }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}

      - name: Importar recursos existentes al estado de Terraform
        working-directory: ./
        run: |
          echo "🔄 Importando recursos existentes que pueden causar conflictos..."
          chmod +x scripts/import-existing-resources.sh
          ./scripts/import-existing-resources.sh || echo "⚠️ Algunos recursos no se pudieron importar, continuando..."
        continue-on-error: true
        env:
          AWS_REGION: us-east-1
          ENVIRONMENT: dev
          PROJECT_NAME: foodoffice
          TERRAFORM_DIR: terraform
          TF_VAR_environment: dev
          TF_VAR_bucket_name: ${{ secrets.TF_VAR_BUCKET_NAME }}
          TF_VAR_github_repository: ${{ secrets.TF_VAR_GITHUB_REPOSITORY }}
          TF_VAR_oidc_provider_arn: ${{ secrets.TF_VAR_OIDC_PROVIDER_ARN }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -out=tfplan
        env:
          TF_VAR_environment: dev
          TF_VAR_bucket_name: ${{ secrets.TF_VAR_BUCKET_NAME }}
          TF_VAR_github_repository: ${{ secrets.TF_VAR_GITHUB_REPOSITORY }}
          TF_VAR_oidc_provider_arn: ${{ secrets.TF_VAR_OIDC_PROVIDER_ARN }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}

      - name: Terraform Apply
        id: terraform-apply
        working-directory: ./terraform
        continue-on-error: true
        run: terraform apply -auto-approve tfplan 2>&1 | tee /tmp/apply-output.txt
        env:
          TF_VAR_environment: dev
          TF_VAR_bucket_name: ${{ secrets.TF_VAR_BUCKET_NAME }}
          TF_VAR_github_repository: ${{ secrets.TF_VAR_GITHUB_REPOSITORY }}
          TF_VAR_oidc_provider_arn: ${{ secrets.TF_VAR_OIDC_PROVIDER_ARN }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}

  destroy-development:
    if: inputs.action == 'destroy' && github.ref == 'refs/heads/develop'
    name: Destroy Infraestructura de Desarrollo
    runs-on: ubuntu-latest
    environment: development
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # - name: Setup Terraform
      #   uses: hashicorp/setup-terraform@v3
      #   with:
      #     terraform_version: 1.13.4

      # - name: Configure Git credentials for private modules
      #   run: |
      #     git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

