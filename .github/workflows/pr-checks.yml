name: PR Checks - Tests & Lint

on:
  pull_request:
    branches:
      - develop
      - main
      - staging
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: pr-checks-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar lint
        run: npm run lint
        continue-on-error: false

      - name: Verificar formato con Prettier
        run: npx prettier --check . || echo "⚠️ Prettier check falló. Ejecuta 'npm run format' para corregir."

      - name: Verificar tipos TypeScript
        run: npm run check

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests con Jest
        run: npm run test
        continue-on-error: false
        env:
          CI: true
      
      - name: Mostrar resumen de tests
        if: always()
        run: |
          echo "## 📊 Resumen de Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Tests ejecutados con Jest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Para ver más detalles, ejecuta \`npm run test\` localmente." >> $GITHUB_STEP_SUMMARY


  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [lint-frontend, test-frontend]
    if: always()
    
    steps:
      - name: Resumen de validaciones
        run: |
          echo "## ✅ Resumen de Validaciones PR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint Frontend | ${{ needs.lint-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Frontend | ${{ needs.test-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.lint-frontend.result }}" != "success" ] || \
             [ "${{ needs.test-frontend.result }}" != "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **Algunas validaciones fallaron. Por favor, revisa los errores antes de hacer merge.**" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Todas las validaciones pasaron exitosamente.**" >> $GITHUB_STEP_SUMMARY
          fi
