name: Deploy Frontend

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod

concurrency:
  group: deploy-${{ github.ref_name }}-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Deploy a Desarrollo
    if: |
      (github.ref == 'refs/heads/develop' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
    runs-on: ubuntu-latest
    environment: development
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install

      - name: Configurar variables de entorno
        run: |
          # Crear archivo .env con las variables de entorno para desarrollo
          cat > .env << EOF
          NODE_ENV=development
          OWNER_OPEN_ID=${{ secrets.OWNER_OPEN_ID || 'admin-local' }}
          OWNER_NAME=${{ secrets.OWNER_NAME || 'Administrador' }}
          VITE_APP_TITLE=${{ secrets.VITE_APP_TITLE || 'Sistema de Pedidos' }}
          VITE_APP_LOGO=${{ secrets.VITE_APP_LOGO || '/logo.svg' }}
          OAUTH_SERVER_URL=${{ secrets.OAUTH_SERVER_URL }}
          VITE_APP_ID=${{ secrets.VITE_APP_ID }}
          VITE_OAUTH_PORTAL_URL=${{ secrets.VITE_OAUTH_PORTAL_URL }}
          OAUTH_CLIENT_SECRET=${{ secrets.OAUTH_CLIENT_SECRET }}
          VITE_API_URL=${{ secrets.VITE_API_URL || 'http://localhost:3000' }}
          EOF
          echo "✅ Archivo .env creado para ambiente: dev"
          echo "Variables configuradas (valores sensibles ocultos)"

      - name: Build aplicación
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Configure Git credentials for private modules
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4

      - name: Obtener outputs de Terraform
        id: terraform-outputs
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=foodoffice-terraform-state" \
            -backend-config="key=environments/dev/terraform.tfstate" \
            -backend-config="region=us-east-2" \
            -backend-config="dynamodb_table=terraform-state-lock" \
            -backend-config="encrypt=true" \
            -reconfigure
          
          S3_BUCKET=$(terraform output -raw s3_bucket_name)
          CLOUDFRONT_ID=$(terraform output -raw cloudfront_distribution_id)
          CLOUDFRONT_URL=$(terraform output -raw cloudfront_distribution_url)
          
          echo "bucket=$S3_BUCKET" >> $GITHUB_OUTPUT
          echo "cloudfront_id=$CLOUDFRONT_ID" >> $GITHUB_OUTPUT
          echo "cloudfront_url=$CLOUDFRONT_URL" >> $GITHUB_OUTPUT
          
          echo "S3 Bucket: $S3_BUCKET"
          echo "CloudFront ID: $CLOUDFRONT_ID"
          echo "CloudFront URL: $CLOUDFRONT_URL"

      - name: Sincronizar archivos con S3
        run: |
          aws s3 sync dist/ s3://${{ steps.terraform-outputs.outputs.bucket }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "*.html"
          
          # Subir HTML sin cache para que siempre se actualice
          aws s3 sync dist/ s3://${{ steps.terraform-outputs.outputs.bucket }}/ \
            --cache-control "public, max-age=0, must-revalidate" \
            --include "*.html"

      - name: Invalidar CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.terraform-outputs.outputs.cloudfront_id }} \
            --paths "/*"

      - name: Mostrar URL de despliegue
        run: |
          echo "✅ Deploy completado exitosamente!"
          echo "🌐 URL: ${{ steps.terraform-outputs.outputs.cloudfront_url }}"

  deploy-staging:
    name: Deploy a Staging
    if: |
      (github.ref == 'refs/heads/staging' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    runs-on: ubuntu-latest
    environment: staging
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
