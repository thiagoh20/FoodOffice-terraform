name: CD - Desarrollo

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  ENVIRONMENT: dev

jobs:
  deploy:
    name: Deploy a Desarrollo
    runs-on: ubuntu-latest
    environment: development
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Build aplicación
        run: npm run build

      # Ejemplo: Deploy a Vercel
      # - name: Deploy a Vercel
      #   uses: amondnet/vercel-action@v25
      #   with:
      #     vercel-token: ${{ secrets.VERCEL_TOKEN }}
      #     vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
      #     vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
      #     vercel-args: '--prod'

      # Ejemplo: Deploy con Terraform
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4

      - name: Terraform Init
        working-directory: ./infrastructure/terraform/environments/dev
        run: terraform init

      - name: Terraform Plan
        working-directory: ./infrastructure/terraform/environments/dev
        run: terraform plan -out=tfplan
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_bucket_name: ${{ secrets.TF_VAR_BUCKET_NAME }}
          TF_VAR_github_repository: ${{ secrets.TF_VAR_GITHUB_REPOSITORY }}

      - name: Terraform Apply
        working-directory: ./infrastructure/terraform/environments/dev
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_bucket_name: ${{ secrets.TF_VAR_BUCKET_NAME }}
          TF_VAR_github_repository: ${{ secrets.TF_VAR_GITHUB_REPOSITORY }}